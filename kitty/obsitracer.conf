# ═══════════════════════════════════════════════════════════════════
# 🧠 Obsitracer — Plugin Oficial para Kitty Terminal
# ═══════════════════════════════════════════════════════════════════

# --- 🚀 Selector Interactivo de Vault en Popup Flotante sobre Todo el Tab ---
# Alt + o (Acceso directo universal)
map alt+o kitten obsitracer_select.py

# Modal Tmux (Ctrl + a seguido de o)
map --mode tmux o kitten obsitracer_select.py

# --- 📑 Widget de Foco en la Barra de Pestañas (Tab Bar) ---
tab_bar_style custom
tab_bar_min_tabs 1
